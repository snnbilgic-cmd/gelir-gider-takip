name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (if not exists)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Replace app icons from www/assets/icon.png
        run: |
          SRC="www/assets/icon.png"
          if [ ! -f "$SRC" ]; then
            echo "⚠️  www/assets/icon.png bulunamadı, varsayılan ikon kullanılacak."
            exit 0
          fi
          RES="android/app/src/main/res"
          # Icon boyutları (px)
          declare -A sizes=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )
          for dir in "${!sizes[@]}"; do
            size="${sizes[$dir]}"
            mkdir -p "$RES/$dir"
            convert "$SRC" -resize ${size}x${size} "$RES/$dir/ic_launcher.png"
            convert "$SRC" -resize ${size}x${size} "$RES/$dir/ic_launcher_round.png"
            convert "$SRC" -resize ${size}x${size} "$RES/$dir/ic_launcher_foreground.png" || true
          done
          # Adaptive icon XML'leri varsa sil (yoksa sorun değil)
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" || true
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" || true
          echo "✅ İkonlar başarıyla değiştirildi"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gelir-gider-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
